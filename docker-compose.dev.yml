services:
  odysseus:
    volumes:
      - .:/app:z
    environment:
      - ODYSSEUS_DEV_MODE=1
      - ODYSSEUS_RELOAD=1
      - ODYSSEUS_RELOAD_ACTIVE=1
    command:
      - uvicorn
      - app:app
      - --host
      - 0.0.0.0
      - --port
      - "7000"
      - --reload
      - --reload-dir
      - /app
